<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">
    <title>transitions</title>

    <style>
        div{
            width: 400px;
            height: 400px;
            background-color: cadetblue;
            transition: width 2s, height 2s, background-color 2s;
            border-radius: 10px;
        }

        div:hover{
            width: 800px;
            height: 200px;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
