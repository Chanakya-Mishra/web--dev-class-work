<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        img {
            position: absolute;
            left: 0px;
            top: 0px;
            z-index: -1;
        }

        p {
            color: rgb(130, 19, 74);
        }
    </style>

</head>

<body>
    <h1>Mirai school of technology</h1>
    <img src="treeimg.png">
    <p>since this image has z-index as -1, it will be placed behind the text.</p>
</body>

</html>
